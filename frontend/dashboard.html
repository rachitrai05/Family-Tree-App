<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-100 to-gray-300 min-h-screen flex items-center justify-center">

<div class="bg-white/70 backdrop-blur-xl p-10 rounded-3xl shadow-2xl text-center w-[500px] border border-gray-200">

  <!-- Welcome -->
  <h1 id="welcomeText" class="text-3xl font-semibold mb-8 text-gray-800">
    👋 Welcome
  </h1>

  <!-- Buttons -->
  <div class="flex flex-col gap-4">

  <!-- Add Member -->
<a href="add.html"
  class="bg-gray-900 text-white py-3 rounded-xl font-medium 
  hover:bg-gray-800 hover:scale-105 hover:shadow-xl 
  transition duration-200">
  ➕ Add Member
</a>

<!-- View Tree -->
<a href="tree.html"
  class="bg-white border border-gray-300 text-gray-800 py-3 rounded-xl font-medium 
  hover:bg-gray-100 hover:scale-105 hover:shadow-lg 
  transition duration-200">
  🌳 View Tree
</a>

<!-- Members -->
<a href="members.html"
  class="bg-white border border-gray-300 text-gray-800 py-3 rounded-xl font-medium 
  hover:bg-gray-100 hover:scale-105 hover:shadow-lg 
  transition duration-200">
  👨‍👩‍👧 Members List
</a>

<!-- Logout -->
<button onclick="logout()"
  class="bg-red-500 text-white py-3 rounded-xl 
  hover:bg-red-600 hover:scale-105 hover:shadow-xl 
  transition duration-200">
  🚪 Logout
</button>

  </div>

</div>

<script>
// 🔐 Auth check
const token = localStorage.getItem("token");
if (!token) window.location.href = "home.html";

// 👋 Welcome text
const user = localStorage.getItem("user");
document.getElementById("welcomeText").innerText = "👋 Welcome " + (user || "User");

// 🚪 Logout
function logout() {
  localStorage.clear();
  window.location.href = "home.html";
}

</script>

</body>
</html>
