<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-gray-200 flex items-center justify-center h-screen">

<div class="bg-white p-6 rounded-xl shadow w-80">
  <h2 class="text-2xl font-bold mb-4 text-center">Signup</h2>

  <input id="name" placeholder="Name" class="border p-2 w-full mb-2 rounded">
  <input id="email" placeholder="Email" class="border p-2 w-full mb-2 rounded">
  <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-4 rounded">

  <button onclick="signup()" class="bg-green-500 text-white w-full py-2 rounded hover:bg-green-600">
    Signup
  </button>

  <p class="text-center mt-3 text-sm">
    Already have account? 
    <a href="login.html" class="text-blue-500">Login</a><br>
    <a href="home.html" class="text-blue-500">Back to Dashboard</a>
  </p>
  
</div>

<script>
const API = "https://family-tree-app-i1rl.onrender.com";

async function signup() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(API + "/signup", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ name, email, password })
  });

  const data = await res.json();
  alert(data.message || "Signup done");
  window.location.href = "login.html";
}
</script>

</body>
</html>
